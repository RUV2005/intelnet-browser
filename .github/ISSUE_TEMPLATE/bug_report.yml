name: Bug Report
description: 报告一个 bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 bug！请填写以下信息帮助我们定位问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要描述遇到的问题
      placeholder: 例如：点击"页面摘要"按钮时程序崩溃
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细的操作步骤
      placeholder: |
        1. 打开浏览器
        2. 访问 https://example.com
        3. 点击"页面摘要"按钮
        4. 程序崩溃
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
      placeholder: 应该显示页面摘要
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 程序崩溃并显示错误信息
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如：Windows 11 23H2
    validations:
      required: true

  - type: input
    id: qt-version
    attributes:
      label: Qt 版本
      placeholder: 例如：Qt 6.8.0
    validations:
      required: false

  - type: input
    id: rust-version
    attributes:
      label: Rust 版本
      placeholder: 例如：rustc 1.75.0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: 粘贴相关的错误日志或控制台输出
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果适用，添加截图帮助说明问题
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息
    validations:
      required: false
