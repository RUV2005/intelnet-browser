[package]
name = "intelnet-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "intelnet_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0"
base64 = "0.21"
image = "0.24"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "4.4"
rodio = "0.17"

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "ffi_bench"
harness = false
